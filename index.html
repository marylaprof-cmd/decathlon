<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Stage Decathlon Épinal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap">
<style>
/* Layout : carnet de stage. Bandeau collant (logo + navigation par pôle), une colonne ; chaque pôle a trois onglets : Missions (avec grille sous chaque mission), Ressources, Mon bilan. */
:root{
  --bg:#f4f7f3; --surface:#ffffff; --ink:#15251f; --muted:#56675f; --line:#d3ded6;
  --sapin:#1f6f5c; --sapin-soft:#dcefe8; --soleil:#ffd166; --on-soleil:#15251f; --on-accent:#ffffff;
  --ciel:#cfe8f3; --mont1:#9fc3b5; --mont2:#6fa392; --mur:#eef2ee; --vitre:#bfe0ea; --sol:#c9d2cc;
  --ts:#1e8e4a; --s:#9bd15a; --i:#f6a23a; --ti:#d8452f; --on-ts:#ffffff; --on-s:#15251f; --on-i:#15251f; --on-ti:#ffffff;
  --display:"Outfit","Trebuchet MS",system-ui,sans-serif; --body:"Nunito Sans","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101915; --surface:#1a2620; --ink:#ecf4ef; --muted:#a9bbb1; --line:#33443b;
  --sapin:#7fd1b9; --sapin-soft:#1d3a31; --on-accent:#101915;
  --ciel:#1c3442; --mont1:#2d4a41; --mont2:#24403a; --mur:#3a4841; --vitre:#3f6b78; --sol:#26332d; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101915; --surface:#1a2620; --ink:#ecf4ef; --muted:#a9bbb1; --line:#33443b;
  --sapin:#7fd1b9; --sapin-soft:#1d3a31; --on-accent:#101915;
  --ciel:#1c3442; --mont1:#2d4a41; --mont2:#24403a; --mur:#3a4841; --vitre:#3f6b78; --sol:#26332d; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p,ul,ol{margin:0} ul,ol{padding-left:1.2rem}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sapin);outline-offset:2px}
a{color:var(--sapin);font-weight:700}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--sapin)}
.bar .top{display:flex;align-items:center;gap:.7rem;padding:.4rem 16px}
.bar img{width:48px;height:48px;border-radius:50%;flex:none}
.bar .who{flex:1;min-width:0}
.bar .who b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.1}
.bar .who span{font-size:.72rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.nav{display:flex;gap:.4rem;overflow-x:auto;padding:0 16px .5rem}
.nav button{white-space:nowrap;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:.3rem .85rem;font-weight:700;font-size:.9rem}
.nav button[aria-current=true]{background:var(--sapin);border-color:var(--sapin);color:var(--on-accent)}
main{max-width:50rem;margin:0 auto;padding-inline:16px;padding-block:1.5rem 4rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.big{gap:1.8rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sapin);font-weight:700}
h1{font-size:clamp(1.9rem,7vw,2.8rem);font-weight:800} h1 em{font-style:normal;background:var(--soleil);color:var(--on-soleil);padding:0 .2em;border-radius:6px}
h2{font-size:1.5rem} h3{font-size:1.2rem} h4{font-size:1rem}
.small{font-size:.85rem;color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:1.1rem;display:flex;flex-direction:column;gap:.7rem;min-width:0}
.memo{background:var(--sapin-soft);border-radius:16px 16px 16px 4px;padding:.9rem 1rem}
.say{display:flex;gap:.7rem;align-items:flex-start}.say>div{min-width:0}.av{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--sapin);color:var(--on-accent);font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center}.nm{display:block;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--sapin)}
.vise{border-left:5px solid var(--soleil);padding:.2rem 0 .2rem .8rem;font-size:.9rem;display:flex;flex-direction:column;gap:.25rem}.vise .pb{font-family:var(--display);font-size:1.05rem}.vise ul{padding-left:1.1rem}
.doc{border:2px dashed var(--line);border-radius:12px;padding:.8rem 1rem;background:var(--bg)}
.shop{width:100%;aspect-ratio:3/2;object-fit:cover;object-position:50% 62%;border-radius:16px;display:block;border:2px solid var(--line)}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
.kpi{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
.kpi div{background:var(--sapin-soft);border-radius:12px;padding:.6rem .8rem}
.kpi b{display:block;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.pole{text-align:left;align-items:flex-start}
.pill{font-size:.8rem;background:var(--soleil);color:var(--on-soleil);border-radius:999px;padding:.1rem .7rem;font-weight:700;align-self:flex-start}
.track{height:10px;border-radius:999px;background:var(--sapin-soft);overflow:hidden;width:100%}
.track i{display:block;height:100%;background:var(--sapin);border-radius:999px}
.btn{background:var(--sapin);color:var(--on-accent);border:0;border-radius:12px;padding:.6rem 1.1rem;font-weight:700;align-self:flex-start}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:.6rem}
.tabs button{border:0;background:transparent;padding:.4rem .8rem;border-radius:10px;font-weight:700}
.tabs button[aria-selected=true]{background:var(--sapin-soft);color:var(--sapin)}
label.f{display:flex;flex-direction:column;gap:.25rem;font-weight:700;font-size:.92rem}
input[type=text],textarea,select{width:100%;padding:.6rem .7rem;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400}
textarea{min-height:4.5rem;resize:vertical}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.in td{padding:.2rem} table.in input{min-width:8rem;padding:.4rem .5rem}
.q{display:flex;flex-direction:column;gap:.4rem;padding:.7rem 0;border-bottom:1px dashed var(--line)}
.opts{display:flex;gap:.4rem;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:.35rem .8rem;text-align:left}
.opt.good{background:var(--ts);border-color:var(--ts);color:var(--on-ts);font-weight:700}
.opt.bad{background:var(--ti);border-color:var(--ti);color:var(--on-ti)}
.why{font-size:.88rem;color:var(--muted)}
.eval{border:2px solid var(--sapin);border-radius:14px;padding:.9rem;display:flex;flex-direction:column;gap:.6rem;background:var(--bg)}
.eval .ref{font-size:.88rem}
.ind{display:flex;flex-direction:column;gap:.35rem;padding:.5rem 0;border-top:1px solid var(--line)}
.lv{display:grid;gap:.3rem;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr))}
.lv label{border:2px solid var(--c);border-radius:10px;padding:.3rem .5rem;font-size:.82rem;cursor:pointer;background:var(--surface);display:flex;align-items:center;gap:.4rem;font-weight:700}
.lv label::before{content:"";width:.8rem;height:.8rem;border-radius:50%;background:var(--c);flex:none}
.lv input{position:absolute;opacity:0}
.lv label:has(input:checked){background:var(--c);color:var(--oc)}
.lv label:has(input:checked)::before{background:var(--oc)}
.lv label:has(input:focus-visible){outline:3px solid var(--ink)}
.l1{--c:var(--ts);--oc:var(--on-ts)} .l2{--c:var(--s);--oc:var(--on-s)} .l3{--c:var(--i);--oc:var(--on-i)} .l4{--c:var(--ti);--oc:var(--on-ti)}
.chip{display:inline-block;border-radius:999px;padding:.05rem .6rem;font-size:.78rem;font-weight:700;background:var(--c);color:var(--oc)}
.chip.l0{--c:var(--line);--oc:var(--ink)}
.poster{border-radius:16px;padding:1.6rem 1.2rem;text-align:center;display:flex;flex-direction:column;gap:.7rem;align-items:center;background:var(--sapin);color:var(--on-accent);max-width:20rem;align-self:center;width:100%;aspect-ratio:3/4;justify-content:center}
.poster.c2{background:var(--soleil);color:var(--on-soleil)} .poster.c3{background:var(--ti);color:var(--on-ti)}
.poster .a{font-family:var(--display);font-size:1.8rem;font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.poster .o{background:var(--surface);color:var(--ink);border-radius:12px;padding:.5rem .8rem;font-weight:700;overflow-wrap:anywhere}
.poster .c{font-size:.8rem;overflow-wrap:anywhere}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:1rem;font-family:var(--body);font-size:.9rem;margin:0}
#print{display:none}
.pr h1{font-size:1.4rem;margin-bottom:.2rem}.pr h2{font-size:1.15rem;margin:1.2rem 0 .3rem;border-bottom:2px solid var(--sapin);padding-bottom:.2rem}.pr h3{font-size:1rem;margin:.9rem 0 .2rem}
.pr .ans{border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.8rem;margin:.1rem 0 .5rem}
.pr .lab{font-weight:700;font-size:.88rem}.pr .meta{font-size:.85rem;color:var(--muted)}.pr table{margin-bottom:.5rem}.pr .blk{break-inside:avoid}
@media print{
  :root{--bg:#ffffff;--surface:#ffffff;--ink:#15251f;--muted:#56675f;--line:#b9c7bd;--sapin:#1f6f5c;--sapin-soft:#dcefe8}
  body{background:#ffffff}
  body>header,main{display:none!important}
  #print{display:block;padding:0;font-size:11pt}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
footer{font-size:.8rem;color:var(--muted);text-align:center;margin-top:2.5rem}
</style>

</head>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = {v:{}, g:{}, t:{}, view:"home", tab:{}};
try { const r = JSON.parse(localStorage.getItem("stage-sport-epinal") || "null"); if (r && r.v) S = Object.assign(S, r); } catch(e){}
const save = () => { try { localStorage.setItem("stage-sport-epinal", JSON.stringify(S)); } catch(e){} };
const val = id => S.v[id] || "";

function fieldIds(p){ const out = []; p.missions.forEach((m,mi) => m.fields.forEach(f => out.push([p.id+"-"+mi+"-"+f[0], f]))); return out; }
function filled(id, f){ if (f[2] === "select") return true; if (f[2] !== "table") return val(id).trim() !== ""; for (let r = 0; r < f[4]; r++) if (val(id+"-"+r+"-0").trim()) return true; return false; }
function progress(p){ const ids = fieldIds(p); let done = ids.filter(x => filled(x[0], x[1])).length, tot = ids.length;
  p.missions.forEach((m,mi) => m.ind.forEach((_,i) => { tot++; if (S.g[p.id+"-"+mi+"-"+i]) done++; }));
  p.train.items.forEach((_,i) => { tot++; if (S.t[p.id+"-"+i] != null) done++; });
  return Math.round(done / tot * 100); }

function renderNav(){
  const items = [["home","Accueil"]].concat(POLES.map((p,i) => [p.id, "Pôle "+(i+1)]), [["dossier","Mon dossier"]]);
  $("nav").innerHTML = items.map(x => `<button data-view="${x[0]}" aria-current="${S.view === x[0]}">${x[1]}</button>`).join("");
}
function fieldHTML(id, f){
  const ph = f[5] ? ` placeholder="${esc(f[5])}"` : "";
  if (f[2] === "table") return `<div class="stack" style="gap:.3rem"><b style="font-size:.92rem">${f[1]}</b><div class="tw"><table class="in"><thead><tr>${f[3].map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${
    Array.from({length:f[4]}, (_,r) => `<tr>${f[3].map((c,k) => `<td><input type="text" id="${id}-${r}-${k}" aria-label="${esc(c)}, ligne ${r+1}" value="${esc(val(id+"-"+r+"-"+k))}"></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  if (f[2] === "select") return `<label class="f">${f[1]}<select id="${id}">${f[3].map(o => `<option ${val(id) === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
  if (f[2] === "area") return `<label class="f">${f[1]}<textarea id="${id}"${ph}>${esc(val(id))}</textarea></label>`;
  return `<label class="f">${f[1]}<input type="text" id="${id}" value="${esc(val(id))}"${ph}></label>`;
}
function posterHTML(){ const k = "p1-2-"; const c = {"Jaune":"c2","Rouge":"c3"}[val(k+"coul")] || "";
  return `<div class="poster ${c}" id="poster"><span class="a">${esc(val(k+"accroche") || "Votre accroche ici")}</span><span class="o">${esc(val(k+"offretxt") || "Ce que vous proposez")}</span><span class="c">${esc(val(k+"cond") || "Quand et où ?")}</span></div>`; }
function trainItem(p, i){ const it = p.train.items[i], a = S.t[p.id+"-"+i];
  return `<div class="q" id="tr-${p.id}-${i}"><span>${esc(it[0])}</span><div class="opts">${p.train.o.map((o,j) => `<button class="opt ${a != null && j === it[1] ? "good" : a === j ? "bad" : ""}" data-tr="${p.id}|${i}|${j}" ${a != null ? "disabled" : ""}>${o}</button>`).join("")}</div>${a != null ? `<span class="why">${a === it[1] ? "Nadia : « Exactement. » " : "Nadia : « Pas tout à fait. » "}${esc(it[2])}</span>` : ""}</div>`; }
function evalHTML(p, m, mi){
  return `<div class="eval"><h4>Je m'auto-évalue</h4><p class="small"><b>Nadia :</b> « Avant de me rendre votre travail, relisez-le et évaluez-le honnêtement, comme je le ferai moi-même. »</p><p class="ref"><b>Critère du référentiel :</b> ${m.crit}</p>${m.ind.map((t,i) => { const k = p.id+"-"+mi+"-"+i;
    return `<div class="ind"><span><b>Indicateur :</b> ${t}</span><div class="lv" role="radiogroup" aria-label="${esc(t)}">${LV.map((l,j) => `<label class="l${j+1}"><input type="radio" name="g-${k}" value="${j+1}" ${S.g[k] == j+1 ? "checked" : ""}>${l}</label>`).join("")}</div></div>`; }).join("")}</div>`;
}
function nadia(txt){ return `<div class="memo say"><span class="av" aria-hidden="true">N</span><div><b class="nm">Nadia Keller · responsable du magasin</b><p>${txt}</p></div></div>`; }
function viseHTML(p, mi){ const x = EXTRA[p.id+"-"+mi], m = p.missions[mi];
  return `<div class="vise"><span class="small" style="text-transform:uppercase;letter-spacing:.06em;font-weight:700">Problématique</span><span class="pb">${x.pb}</span><span><b>Tâche visée :</b> ${m.tache}</span><span><b>Compétence${x.comp.length > 1 ? "s" : ""} visée${x.comp.length > 1 ? "s" : ""} :</b></span><ul>${x.comp.map(c => `<li>${c}</li>`).join("")}</ul><span class="small">${p.bloc} · référentiel du bac pro Métiers du commerce et de la vente</span></div>`; }
function renderPole(p, n){
  const tab = S.tab[p.id] || "missions";
  let body = "";
  if (tab === "missions") body = (p.doc ? `<div class="card"><div class="doc">${p.doc}</div></div>` : "") + `<div class="card"><h3>${p.train.t}</h3>${nadia(p.train.i)}${p.train.items.map((_,i) => trainItem(p,i)).join("")}</div>` +
    p.missions.map((m,mi) => `<div class="card"><h3>${m.t}</h3>${viseHTML(p, mi)}<h4>Mise en situation</h4>${nadia(m.brief)}${m.doc ? `<div class="doc">${m.doc}</div>` : ""}${m.fields.map(f => fieldHTML(p.id+"-"+mi+"-"+f[0], f)).join("")}${m.affiche ? `<h4>Aperçu de la maquette</h4>${posterHTML()}` : ""}<p class="small"><b>Nadia :</b> « Un doute ? Mes fiches sont dans l'onglet Ressources. Un professionnel cherche d'abord par lui-même. »</p>${evalHTML(p, m, mi)}<button class="btn" data-pdf="${p.id}|${mi}">Enregistrer cette mission en PDF</button><p class="small">Dans la fenêtre qui s'ouvre, choisissez « Enregistrer au format PDF », puis rangez le fichier dans votre dossier de classe.</p></div>`).join("");
  if (tab === "res") body = nadia("Voici les fiches que je remets à chaque nouveau membre de l'équipe. Gardez-les sous la main pendant vos missions.") + p.res.map(r => `<div class="card"><h3>${r[0]}</h3>${r[1]}</div>`).join("");
  if (tab === "bilan") body = nadia("Faisons le point sur ce dossier. Voici comment vous avez évalué votre travail : dites-moi ce que vous avez le mieux réussi et ce que vous voulez encore travailler.") + `<div class="card"><h3>Mes auto-évaluations du pôle</h3><p class="small">${p.bloc} (référentiel du bac pro Métiers du commerce et de la vente)</p><div class="tw"><table><thead><tr><th>Tâche du référentiel</th><th>Indicateur</th><th>Mon niveau</th></tr></thead><tbody>${
      p.missions.map((m,mi) => m.ind.map((t,i) => { const g = S.g[p.id+"-"+mi+"-"+i] || 0; return `<tr><td>${i === 0 ? "<b>"+m.tache+"</b>" : ""}</td><td>${t}</td><td><span class="chip l${g}">${g ? LV[g-1] : "À compléter"}</span></td></tr>`; }).join("")).join("")}</tbody></table></div></div>
    <div class="card">${fieldHTML(p.id+"-bilan-ok", ["","Ce que j'ai le mieux réussi dans ce pôle","area"])}${fieldHTML(p.id+"-bilan-plus", ["","Ce que je dois encore travailler","area"])}</div>`;
  return `<div class="stack"><span class="eyebrow">Pôle ${n} · ${p.nom} · ${p.duree}</span><h1>${p.titre}</h1>${nadia(p.memo)}</div>
    <div class="tabs" role="tablist">${[["missions","Missions"],["res","Ressources"],["bilan","Mon bilan"]].map(t => `<button role="tab" data-tab="${p.id}|${t[0]}" aria-selected="${tab === t[0]}">${t[1]}</button>`).join("")}</div>
    <div class="stack">${body}</div>`;
}
function renderHome(){
  return `<div class="stack"><span class="eyebrow">Seconde · Famille des métiers de la relation client · 4 pôles</span>
    <h1>Bienvenue dans <em>l'équipe</em> !</h1>${SHOP}
    ${nadia(`Bonjour et bienvenue au magasin Decathlon d'Épinal. Je suis Nadia, responsable du magasin, et je serai votre tutrice pendant ce stage. Ici, on ne vous demandera pas de regarder : vous allez travailler comme un vrai membre de l'équipe. Je vous confie quatre dossiers, un par pôle. Pour chacun, je vous laisse ma consigne, des fiches ressources et une grille pour évaluer vous-même votre travail.`)}
    <label class="f">Prénom et nom<input type="text" id="eleve" value="${esc(val("eleve"))}" placeholder="Pour votre dossier"></label></div>
  <div class="card"><h2>Comment je travaille avec mes stagiaires</h2><ol><li>Chaque dossier commence par mon <b>brief du matin</b> : je vous mets en situation et vous savez tout de suite si vous avez vu juste.</li><li>Lisez ensuite <b>ma consigne</b> en haut de chaque mission.</li><li>Complétez la mission. Si vous bloquez, ouvrez l'onglet <b>Ressources</b>.</li><li>Cliquez sur votre niveau dans la grille <b>« Je m'auto-évalue »</b>, honnêtement.</li><li>À la fin de la séance, ouvrez <b>Mon dossier</b> et copiez votre travail.</li></ol></div>
  <div class="card"><h2>Notre magasin en bref</h2>
    <div class="kpi"><div><b>45</b>collaborateurs</div><div><b>60</b>sports représentés</div><div><b>900</b>clients un samedi</div></div>
    <ul><li><b>Ce que nous vendons</b> : des vêtements, des chaussures et du matériel pour pratiquer plus de 60 sports, du débutant au sportif régulier.</li><li><b>Nos services</b> : atelier de réparation, retrait en magasin des commandes passées en ligne, conseils de vendeurs eux-mêmes sportifs.</li><li><b>Nos clients</b> : des familles, des sportifs de tous niveaux, des clubs et des associations d'Épinal et des environs.</li></ul>
    <p class="small">Les chiffres de cette fiche sont inventés pour l'exercice.</p></div>
  <div class="stack"><h2>Vos quatre dossiers</h2><div class="grid">${POLES.map((p,i) => { const pr = progress(p);
    return `<button class="card pole" data-view="${p.id}"><span class="pill">Pôle ${i+1} · ${p.duree}</span><h3>${p.nom}</h3><span>${p.titre}</span><div class="track"><i style="width:${pr}%"></i></div><span class="small">${pr} % réalisé</span></button>`; }).join("")}</div></div>`;
}
function dossierText(){
  let out = "MON STAGE CHEZ DECATHLON ÉPINAL · Dossier de " + (val("eleve") || "(prénom et nom à compléter)") + "\n";
  POLES.forEach((p,n) => { out += "\n==============================\nPÔLE " + (n+1) + " · " + p.nom.toUpperCase() + " (" + progress(p) + " %)\n";
    p.missions.forEach((m,mi) => { out += "\n" + m.t + "\nProblématique : " + EXTRA[p.id+"-"+mi].pb + "\nTâche visée : " + m.tache + "\nCompétences visées : " + EXTRA[p.id+"-"+mi].comp.join(" ; ") + "\n"; m.fields.forEach(f => { const id = p.id+"-"+mi+"-"+f[0];
      if (f[2] === "table") { out += "- " + f[1] + " :\n"; for (let r = 0; r < f[4]; r++) { const row = f[3].map((c,k) => val(id+"-"+r+"-"+k)); if (row.some(x => x.trim())) out += "    " + row.join(" | ") + "\n"; } }
      else out += "- " + f[1] + " : " + (val(id) || (f[2] === "select" ? f[3][0] : "—")) + "\n"; });
      out += "Auto-évaluation (critère : " + m.crit + ")\n"; m.ind.forEach((t,i) => { const g = S.g[p.id+"-"+mi+"-"+i]; out += "  [" + (g ? LV[g-1] : "non évalué") + "] " + t + "\n"; }); });
    out += "\nBilan du pôle\n- Mieux réussi : " + (val(p.id+"-bilan-ok") || "—") + "\n- À travailler : " + (val(p.id+"-bilan-plus") || "—") + "\n"; });
  return out;
}
function renderDossier(){
  return `<div class="stack"><span class="eyebrow">À rendre à Mme Crapsky</span><h1>Mon dossier</h1>${nadia("Voici tout le travail que vous m'avez rendu, avec vos auto-évaluations. Enregistrez-le en PDF : c'est la trace de votre stage, à remettre à Mme Crapsky.")}
    <button class="btn" data-pdf="all">Enregistrer tout mon dossier en PDF</button><p class="small">Dans la fenêtre qui s'ouvre, choisissez « Enregistrer au format PDF ».</p><button class="btn" id="copy" style="background:transparent;color:var(--ink);border:2px solid var(--line)">Copier mon dossier en texte</button><span class="small" id="copied" aria-live="polite"></span></div><pre class="out" id="out" tabindex="0">${esc(dossierText())}</pre>
    <p class="small">Votre travail est enregistré dans ce navigateur, sur cet appareil uniquement. Copiez votre dossier à la fin de chaque séance pour ne rien perdre.</p>`;
}
function missionPrint(p, n, m, mi){
  let h = `<h2>Pôle ${n} · ${p.nom} · ${m.t}</h2><p class="meta"><b>Problématique :</b> ${EXTRA[p.id+"-"+mi].pb}<br><b>Tâche visée :</b> ${m.tache}<br><b>Compétences visées :</b> ${EXTRA[p.id+"-"+mi].comp.join(" ; ")}<br>${p.bloc}</p>`;
  m.fields.forEach(f => { const id = p.id+"-"+mi+"-"+f[0];
    if (f[2] === "table") h += `<div class="blk"><p class="lab">${f[1]}</p><table><thead><tr>${f[3].map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${Array.from({length:f[4]}, (_,r) => `<tr>${f[3].map((c,k) => `<td>${esc(val(id+"-"+r+"-"+k)) || "&nbsp;"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    else h += `<div class="blk"><p class="lab">${f[1]}</p><div class="ans">${esc(val(id) || (f[2] === "select" ? f[3][0] : ""))}</div></div>`; });
  h += `<div class="blk"><h3>Mon auto-évaluation</h3><p class="meta"><b>Critère :</b> ${m.crit}</p><table><tbody>${m.ind.map((t,i) => { const g = S.g[p.id+"-"+mi+"-"+i] || 0; return `<tr><td>${t}</td><td><span class="chip l${g}">${g ? LV[g-1] : "Non évalué"}</span></td></tr>`; }).join("")}</tbody></table></div>`;
  return h;
}
function printOut(what){
  const who = val("eleve") || "Prénom et nom à compléter", date = new Date().toLocaleDateString("fr-FR");
  let h = `<h1>Mon stage chez Decathlon Épinal</h1><p class="meta"><b>${esc(who)}</b> · ${date} · Scénario de Mme Crapsky, lycée Isabelle Viviani</p>`, name;
  if (what === "all") { POLES.forEach((p,n) => { p.missions.forEach((m,mi) => h += missionPrint(p, n+1, m, mi));
      h += `<div class="blk"><h3>Bilan du pôle ${n+1}</h3><p class="lab">Ce que j'ai le mieux réussi</p><div class="ans">${esc(val(p.id+"-bilan-ok"))}</div><p class="lab">Ce que je dois encore travailler</p><div class="ans">${esc(val(p.id+"-bilan-plus"))}</div></div>`; });
    name = who + " - Dossier complet"; }
  else { const [pid, mi] = what.split("|"), n = POLES.findIndex(x => x.id === pid), p = POLES[n]; h += missionPrint(p, n+1, p.missions[+mi], +mi); name = who + " - Pole " + (n+1) + " - Mission " + (+mi+1); }
  $("print").innerHTML = h;
  const old = document.title; document.title = name;
  const back = () => { document.title = old; window.removeEventListener("afterprint", back); };
  window.addEventListener("afterprint", back);
  window.print();
}
function render(){
  renderNav();
  const i = POLES.findIndex(p => p.id === S.view);
  $("app").innerHTML = S.view === "dossier" ? renderDossier() : i >= 0 ? renderPole(POLES[i], i+1) : renderHome();
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.view) { S.view = b.dataset.view; save(); render(); window.scrollTo(0,0); }
  else if (b.dataset.tab) { const [p,t] = b.dataset.tab.split("|"); S.tab[p] = t; save(); render(); }
  else if (b.dataset.tr) { const [p,i,j] = b.dataset.tr.split("|"); S.t[p+"-"+i] = +j; save(); $("tr-"+p+"-"+i).outerHTML = trainItem(POLES.find(x => x.id === p), +i); }
  else if (b.dataset.pdf) printOut(b.dataset.pdf);
  else if (b.id === "copy") { const t = dossierText(); const ok = () => $("copied").textContent = "Dossier copié.";
    const ko = () => { const r = document.createRange(); r.selectNodeContents($("out")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("copied").textContent = "Le texte est sélectionné : faites Copier."; };
    try { navigator.clipboard.writeText(t).then(ok, ko); } catch(err) { ko(); } }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.type === "radio") { S.g[el.name.slice(2)] = +el.value; save(); return; }
  if (!el.id) return;
  S.v[el.id] = el.value; save();
  if ($("poster") && el.id.startsWith("p1-2-")) $("poster").outerHTML = posterHTML();
});
render();
</script>

</body>
</html>
